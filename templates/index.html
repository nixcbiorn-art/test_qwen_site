<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Analytics Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #667eea; margin-bottom: 15px; font-size: 1.3em; }
        .stat-value { font-size: 2.5em; font-weight: bold; color: #333; }
        .stat-label { color: #666; font-size: 0.9em; margin-top: 5px; }
        .city-card { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .temp { color: #e74c3c; }
        .humidity { color: #3498db; }
        .wind { color: #9b59b6; }
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .analytics-item { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; }
        .analytics-item .value { font-size: 1.8em; font-weight: bold; color: #667eea; }
        .analytics-item .label { color: #666; font-size: 0.85em; margin-top: 5px; }
        #chart { background: white; border-radius: 15px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .history-table { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
        .refresh-btn { position: fixed; bottom: 30px; right: 30px; background: #e74c3c; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-size: 1.1em; cursor: pointer; box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); transition: all 0.3s ease; }
        .refresh-btn:hover { background: #c0392b; transform: scale(1.05); }
        .status { position: fixed; top: 20px; right: 20px; background: white; padding: 10px 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 0.9em; }
        .status.good { border-left: 4px solid #2ecc71; }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Weather Analytics Dashboard</h1>
        
        <div class="status good" id="status">● Online</div>
        
        <div class="dashboard" id="citiesDashboard">
            <!-- City cards will be inserted here -->
        </div>
        
        <div class="card" style="margin-bottom: 30px;">
            <h3>📊 Analytics Overview</h3>
            <div class="analytics-grid" id="analyticsGrid">
                <!-- Analytics items will be inserted here -->
            </div>
        </div>
        
        <div id="chart">
            <h3 style="color: #667eea; margin-bottom: 15px;">📈 Temperature Trend</h3>
            <div id="temperatureChart"></div>
        </div>
        
        <div class="history-table">
            <h3 style="color: #667eea; margin-bottom: 15px;">📋 Recent History</h3>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>City</th>
                        <th>Temperature (°C)</th>
                        <th>Humidity (%)</th>
                        <th>Wind Speed (m/s)</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- History rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>

    <script>
        async function loadData() {
            try {
                document.body.classList.add('loading');
                
                // Load current weather
                const weatherResponse = await fetch('/api/weather');
                const weatherData = await weatherResponse.json();
                
                // Render city cards
                const citiesDashboard = document.getElementById('citiesDashboard');
                citiesDashboard.innerHTML = '';
                
                for (const [key, city] of Object.entries(weatherData.cities)) {
                    const card = document.createElement('div');
                    card.className = 'card city-card';
                    card.innerHTML = `
                        <h3>${city.city}</h3>
                        <div class="stat-value temp">${city.temperature !== null ? city.temperature + '°C' : 'N/A'}</div>
                        <div class="stat-label">Temperature</div>
                        <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                            <div>
                                <div class="stat-value humidity" style="font-size: 1.5em;">${city.humidity !== null ? city.humidity + '%' : 'N/A'}</div>
                                <div class="stat-label">Humidity</div>
                            </div>
                            <div>
                                <div class="stat-value wind" style="font-size: 1.5em;">${city.wind_speed !== null ? city.wind_speed + ' m/s' : 'N/A'}</div>
                                <div class="stat-label">Wind</div>
                            </div>
                        </div>
                    `;
                    citiesDashboard.appendChild(card);
                }
                
                // Render analytics
                const analyticsGrid = document.getElementById('analyticsGrid');
                analyticsGrid.innerHTML = '';
                
                const analyticsItems = [
                    { label: 'Average Temperature', value: weatherData.analytics.avg_temperature ? weatherData.analytics.avg_temperature + '°C' : 'N/A' },
                    { label: 'Hottest City', value: weatherData.analytics.hottest_city || 'N/A' },
                    { label: 'Coldest City', value: weatherData.analytics.coldest_city || 'N/A' },
                    { label: 'Max Temperature', value: weatherData.analytics.max_temperature ? weatherData.analytics.max_temperature + '°C' : 'N/A' },
                    { label: 'Min Temperature', value: weatherData.analytics.min_temperature ? weatherData.analytics.min_temperature + '°C' : 'N/A' },
                    { label: 'Average Humidity', value: weatherData.analytics.avg_humidity ? weatherData.analytics.avg_humidity + '%' : 'N/A' },
                    { label: 'Windiest City', value: weatherData.analytics.windiest_city || 'N/A' },
                    { label: 'Total Requests', value: weatherData.total_requests }
                ];
                
                analyticsItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'analytics-item';
                    div.innerHTML = `<div class="value">${item.value}</div><div class="label">${item.label}</div>`;
                    analyticsGrid.appendChild(div);
                });
                
                // Load history and chart
                const historyResponse = await fetch('/api/weather/history');
                const historyData = await historyResponse.json();
                
                // Render history table
                const historyBody = document.getElementById('historyBody');
                historyBody.innerHTML = '';
                
                const recentHistory = historyData.history.slice(-10).reverse();
                recentHistory.forEach(record => {
                    const row = document.createElement('tr');
                    const time = new Date(record.timestamp).toLocaleTimeString();
                    row.innerHTML = `
                        <td>${time}</td>
                        <td>${record.city}</td>
                        <td>${record.temperature !== null ? record.temperature + '°C' : 'N/A'}</td>
                        <td>${record.humidity !== null ? record.humidity + '%' : 'N/A'}</td>
                        <td>${record.wind_speed !== null ? record.wind_speed + ' m/s' : 'N/A'}</td>
                    `;
                    historyBody.appendChild(row);
                });
                
                // Render chart
                if (historyData.chart_data) {
                    const traces = [];
                    const colors = {'moscow': '#e74c3c', 'london': '#3498db', 'newyork': '#2ecc71', 'tokyo': '#9b59b6'};
                    
                    for (const [cityKey, data] of Object.entries(historyData.chart_data)) {
                        traces.push({
                            x: data.timestamps.map(t => new Date(t)),
                            y: data.temperatures,
                            mode: 'lines+markers',
                            name: cityKey.charAt(0).toUpperCase() + cityKey.slice(1),
                            line: { color: colors[cityKey], width: 3 }
                        });
                    }
                    
                    Plotly.newPlot('temperatureChart', traces, {
                        paper_bgcolor: 'rgba(0,0,0,0)',
                        plot_bgcolor: 'rgba(0,0,0,0)',
                        margin: { t: 20, r: 20, l: 50, b: 50 },
                        xaxis: { title: 'Time', gridcolor: '#eee' },
                        yaxis: { title: 'Temperature (°C)', gridcolor: '#eee' }
                    }, { responsive: true, displayModeBar: false });
                }
                
                document.getElementById('status').className = 'status good';
                document.getElementById('status').textContent = '● Online';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('status').className = 'status';
                document.getElementById('status').textContent = '● Offline';
                document.getElementById('status').style.borderLeftColor = '#e74c3c';
            } finally {
                document.body.classList.remove('loading');
            }
        }
        
        // Initial load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
