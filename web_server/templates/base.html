<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MarketMonitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MarketMonitor</div>
        <ul class="nav-links">
            <li><a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">📊 Дашборд</a></li>
            <li><a href="/weather" class="{% if active_page == 'weather' %}active{% endif %}">🌤️ Погода</a></li>
            <li><a href="/parser" class="{% if active_page == 'parser' %}active{% endif %}">🕷️ Парсер</a></li>
            <li><a href="/stocks" class="{% if active_page == 'stocks' %}active{% endif %}">📈 Акции</a></li>
            <li><a href="/settings" class="{% if active_page == 'settings' %}active{% endif %}">⚙️ Настройки</a></li>
            <li><a href="/logs" class="{% if active_page == 'logs' %}active{% endif %}">📋 Логи</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2024 MarketMonitor. Все права защищены.</p>
    </footer>

    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
