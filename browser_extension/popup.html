<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parser Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 350px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        h2 { color: white; margin-bottom: 15px; font-size: 1.3em; text-align: center; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card h3 { color: #667eea; font-size: 1em; margin-bottom: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9em; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button { background: #667eea; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #5568d3; }
        button.secondary { background: #95a5a6; }
        button.secondary:hover { background: #7f8c8d; }
        .result { background: #f8f9fa; border-radius: 5px; padding: 10px; max-height: 200px; overflow-y: auto; font-size: 0.85em; }
        .result pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
        .status { padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 0.85em; text-align: center; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .hidden { display: none; }
        label { display: block; margin-bottom: 5px; color: #333; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>🔍 Parser Tool</h2>
    
    <div id="statusMessage" class="status info hidden"></div>
    
    <div class="card">
        <h3>📄 Parse Current Page</h3>
        <label for="selector">CSS Selector (optional):</label>
        <input type="text" id="selector" placeholder="e.g., .article-title, #main-content">
        <button id="parseBtn">Parse Page</button>
    </div>
    
    <div class="card">
        <h3>🌐 Parse Custom URL</h3>
        <input type="url" id="customUrl" placeholder="https://example.com">
        <label for="customSelector">CSS Selector (optional):</label>
        <input type="text" id="customSelector" placeholder="e.g., h1, .price">
        <button id="parseUrlBtn">Parse URL</button>
    </div>
    
    <div class="card hidden" id="resultCard">
        <h3>📊 Result</h3>
        <div class="result" id="resultContent"></div>
        <button class="secondary" id="copyBtn" style="margin-top: 10px;">Copy to Clipboard</button>
    </div>
    
    <div class="card">
        <h3>🌤️ Quick Weather</h3>
        <button id="weatherBtn">Get Weather Data</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
